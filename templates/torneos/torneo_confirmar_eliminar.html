{% extends 'base.html' %}

{% block title %}Eliminar Torneo | GG-Arena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark text-white border-danger text-center p-4">
            <i class="bi bi-exclamation-triangle text-danger display-3 mb-3"></i>
            <h4 class="fw-bold">¿Eliminar el torneo "{{ torneo.nombre }}"?</h4>
            <p class="text-secondary mb-4">Esta acción retirará el torneo del sistema.</p>
            <form method="post">
                {% csrf_token %}
                <a href="{% url 'torneos:gestion' %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
