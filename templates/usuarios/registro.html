{% extends 'base.html' %}

{% block title %}Registro de Competidor | GG-Arena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark text-white border-secondary p-4">
            <h2 class="fw-bold text-danger text-center mb-4"><i class="bi bi-person-plus me-2"></i>Registro de Jugador</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-danger w-100 fw-bold mt-3">Crear Cuenta</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
